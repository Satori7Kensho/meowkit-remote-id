name: Build MeowKit firmware

on:
  push:
    branches:
      - feature/remote-id-scanner
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install PlatformIO
        run: python -m pip install --upgrade platformio

      - name: Build firmware
        run: pio run -e esp32s3box


      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: meowkit-drone-scanner-test
          path: |
            .pio/build/esp32s3box/firmware.bin
            .pio/build/esp32s3box/bootloader.bin
            .pio/build/esp32s3box/partitions.bin
          if-no-files-found: error
          retention-days: 14
